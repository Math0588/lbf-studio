# Essai de voix Gemini (clé gratuite, secret GEMINI_API_KEY) sur un script : échantillons dans la release « bench ».
name: Essai voix
on:
  workflow_dispatch:
    inputs:
      voix:
        description: "Voix Gemini à essayer (séparées par des espaces)"
        default: "Puck Fenrir Charon"
      script:
        description: "Script"
        default: "content/scripts/bank_ultra/glucksmannville/glv-u07.json"
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      GEMINI_STYLE: ${{ vars.GEMINI_STYLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthétiser
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::secret GEMINI_API_KEY absent"; exit 1; fi
          mkdir -p essai
          for v in ${{ inputs.voix }}; do
            GEMINI_VOICE=$v python3 - "$v" "${{ inputs.script }}" <<'PY'
          import json, subprocess, sys, pathlib
          from lbf import tts_gemini
          v, sp = sys.argv[1], sys.argv[2]
          s = json.load(open(sp, encoding="utf-8"))
          d = pathlib.Path(f"essai/{v}")
          durs = tts_gemini.synthesize_all([n["text"] for n in s["narration_segments"]], d)
          print(v, "durées :", [round(x, 2) for x in durs], "total", round(sum(durs), 1), "s", flush=True)
          lst = d / "liste.txt"
          lst.write_text("".join(f"file 'seg_{i}.wav'\nfile '../../silence.wav'\n" for i in range(len(durs))))
          PY
          done
          ffmpeg -y -loglevel error -f lavfi -i anullsrc=r=48000:cl=mono -t 0.32 silence.wav
          for v in ${{ inputs.voix }}; do
            (cd essai/$v && ffmpeg -y -loglevel error -f concat -safe 0 -i liste.txt -b:a 160k ../voix_gemini_$v.mp3)
          done
          ls -la essai/*.mp3
          gh release view bench >/dev/null 2>&1 || gh release create bench --title "Essais" --notes "Essais techniques" --latest=false
          gh release upload bench essai/*.mp3 --clobber
