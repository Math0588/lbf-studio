# Fabrication automatique des vidéos (PC éteint). Dépôt public : minutes GitHub Actions gratuites.
# Chaque passage fabrique MAX_VIDEOS vidéo(s) et les dépose dans la release publique « reserve ».
name: Fabrication
on:
  schedule:
    - cron: "17 0,5,10,15,20 * * *"   # 5 passages par jour (consommation : 4 Reels par jour)
  workflow_dispatch:
    inputs:
      max_videos:
        description: "Nombre de vidéos à fabriquer dans ce passage"
        default: "1"
  push:
    branches: [main]
    paths: [".github/workflows/produce.yml"]
permissions:
  contents: write
concurrency:
  group: produce
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      MAX_VIDEOS: ${{ inputs.max_videos || '1' }}
      TIME_BUDGET_MIN: "280"
      GH_TOKEN: ${{ github.token }}
      RENDER_QUALITY: ${{ vars.RENDER_QUALITY || 'cloud' }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'auto' }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      AZURE_VOICE: ${{ vars.AZURE_VOICE }}
      VOICE_MODEL: fr_FR-siwis-medium
      MIN_FREE_DISK_GB: "3"
      BLENDER_PATH: /usr/local/bin/blender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - name: Paquets système (ffmpeg, Mesa, xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb libgl1 libegl1 libgl1-mesa-dri libglu1-mesa libxi6 libxxf86vm1 \
            libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 libxrandr2 libxinerama1 libxcursor1 > /dev/null
      - name: Blender en cache
        id: bl
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-5.3-linux-x64-v1
      - name: Télécharger Blender
        if: steps.bl.outputs.cache-hit != 'true'
        run: |
          for v in 5.3 5.2 5.1 5.0; do
            f=$(curl -fsSL "https://download.blender.org/release/Blender$v/" | grep -o "blender-$v\.[0-9]*-linux-x64\.tar\.xz" | sort -V | tail -1)
            if [ -n "$f" ]; then url="https://download.blender.org/release/Blender$v/$f"; break; fi
          done
          echo "Blender : $url"
          curl -fsSL "$url" -o /tmp/blender.tar.xz
          sudo mkdir -p /opt/blender && sudo tar -xf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
      - name: Lanceur Blender (écran virtuel, rendu logiciel Mesa)
        run: |
          printf '#!/bin/sh\nexport LIBGL_ALWAYS_SOFTWARE=1\nexec xvfb-run -a -s "-screen 0 1920x1080x24" /opt/blender/blender "$@"\n' | sudo tee /usr/local/bin/blender > /dev/null
          sudo chmod +x /usr/local/bin/blender
          blender -b --factory-startup --version | head -1
      - name: Dépendances Python
        run: pip install -q -r requirements-cloud.txt
      - name: Voix Piper (secours, vérifiée par sha256)
        run: |
          d=assets/voices/fr_FR-siwis-medium; mkdir -p $d
          b=https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium
          for f in fr_FR-siwis-medium.onnx fr_FR-siwis-medium.onnx.json MODEL_CARD; do curl -fsSL "$b/$f" -o "$d/$f"; done
          python -m lbf.tts
      - name: Fabriquer
        run: python -m lbf.cloud_studio
      - name: Rapport
        if: always()
        run: |
          for r in output/episodes/*/report_final.json; do [ -f "$r" ] && python -c "import json,sys;d=json.load(open(sys.argv[1]));print(sys.argv[1],d.get('status'),d.get('steps'),d.get('render',{}).get('wall_s'))" "$r"; done
          tail -n 40 output/episodes/*/blender_final.log 2>/dev/null | tail -n 60 || true
      - name: Enregistrer l'état
        if: always()
        run: |
          git config user.name "LBF"
          git config user.email "lbf-studio@users.noreply.github.com"
          git add state content/episodes content/sets 2>/dev/null || true
          git diff --cached --quiet || git commit -qm "fabrication : état $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
