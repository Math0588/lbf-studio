name: Banque de sons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["assets/memes/queries.json", "lbf/meme_bank.py"]
permissions:
  contents: write
jobs:
  sounds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: python -m lbf.meme_bank
      - run: |
          git config user.name "LBF"; git config user.email "lbf-studio@users.noreply.github.com"
          git add assets/memes
          git diff --cached --quiet || git commit -qm "banque de sons mèmes"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 7; done
