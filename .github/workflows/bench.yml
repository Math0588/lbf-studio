name: Mesure rendu
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/bench.yml", "lbf/bench_cloud.py", "blender/engine.py"]
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BLENDER_PATH: /usr/local/bin/blender
      GH_TOKEN: ${{ github.token }}
      MIN_FREE_DISK_GB: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-cloud.txt}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb libgl1 libegl1 libgl1-mesa-dri libglu1-mesa libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 > /dev/null
      - id: bl
        uses: actions/cache@v4
        with: {path: /opt/blender, key: blender-5.3-linux-x64-v1}
      - if: steps.bl.outputs.cache-hit != 'true'
        run: |
          for v in 5.3 5.2 5.1 5.0; do f=$(curl -fsSL "https://download.blender.org/release/Blender$v/" | grep -o "blender-$v\.[0-9]*-linux-x64\.tar\.xz" | sort -V | tail -1); if [ -n "$f" ]; then url="https://download.blender.org/release/Blender$v/$f"; break; fi; done
          curl -fsSL "$url" -o /tmp/b.tar.xz && sudo mkdir -p /opt/blender && sudo tar -xf /tmp/b.tar.xz -C /opt/blender --strip-components=1
      - run: |
          printf '#!/bin/sh\nexport LIBGL_ALWAYS_SOFTWARE=1\nexec xvfb-run -a -s "-screen 0 1920x1080x24" /opt/blender/blender "$@"\n' | sudo tee /usr/local/bin/blender > /dev/null && sudo chmod +x /usr/local/bin/blender
          nproc; free -g
      - run: pip install -q -r requirements-cloud.txt
      - run: |
          d=assets/voices/fr_FR-siwis-medium; mkdir -p $d; b=https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium
          for f in fr_FR-siwis-medium.onnx fr_FR-siwis-medium.onnx.json MODEL_CARD; do curl -fsSL "$b/$f" -o "$d/$f"; done
      - run: timeout 2000 python -m lbf.bench_cloud fast
